        body {
          margin: 0;

          display: flex;
          align-items: center;

        }

        }
    
        .video-container {
          position: relative;
          max-width: 100%;

          height: 100%;

          left: 0;
          width: 100%;
          height: 100%;
        }
    
        .page-link {
          text-decoration: none;
          color: #3498db; /* Set the link color */

                  }

            margin-top: 0;

            margin-left: 25px;
        }

        button a {
            text-decoration: none;
            color: inherit;
        }
      </style>
